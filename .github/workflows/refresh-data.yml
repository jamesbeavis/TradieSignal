# =====================================================================
# Tradiesignal :: weekly data refresh
# =====================================================================
# Pulls the current NSW ePlanning data, rescores it, rebuilds the site and
# commits the result. Netlify is watching this branch, so the commit is the
# deploy — nothing else to trigger.
#
# Design rules, learned the hard way:
#   * The DATA refresh is the critical path. The PDF is a nice-to-have and
#     must never be able to block it.
#   * Never download a browser in CI. GitHub's ubuntu-24.04 image already
#     ships Google Chrome; installing our own was the fragile step.
#   * A failure must say which step failed, in the issue it opens, so nobody
#     has to go digging through logs to find out.
#
# Manual run: Actions tab -> Weekly data refresh -> Run workflow.
# =====================================================================

name: Weekly data refresh

on:
  schedule:
    # 18:00 UTC Sunday = 04:00 Monday AEST (05:00 during AEDT).
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Collection window in days'
        required: false
        default: '120'
      skip_pdf:
        description: 'Skip the PDF rebuild (faster)'
        type: boolean
        required: false
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26 on
    # 19 October 2026. A surprise OS upgrade is exactly the kind of change that
    # breaks a weekly job nobody is watching. Move this deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The final step pushes back to this repo using these credentials.
          # Stated explicitly so a future default change can't break the push.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Only the Playwright LIBRARY — no browser download. The PDF step uses
      # the Google Chrome that GitHub's runner image already has installed.
      - name: Install PDF library
        if: ${{ !inputs.skip_pdf }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install playwright --no-save --no-audit --no-fund
          echo "Chrome on this runner: $(google-chrome --version 2>/dev/null || echo 'NOT FOUND')"

      # -----------------------------------------------------------------
      # 1. Collect
      # -----------------------------------------------------------------
      - name: Collect NSW ePlanning data
        id: collect
        env:
          PYTHONPATH: src
        run: |
          python3 src/collect_eplanning.py \
            --days "${{ inputs.days || '120' }}" \
            --out data/raw

      # A misspelled council name, a moved endpoint or an outage all look the
      # same from here: HTTP 200 and no records. Publishing that would wipe the
      # site and nobody would notice for a week. Refuse instead.
      - name: Guard against a silent empty collection
        run: |
          python3 - <<'PY'
          import glob, json, sys

          manifests = sorted(glob.glob("data/raw/manifest_*.json"))
          if not manifests:
              sys.exit("FAIL: no manifest written — the collector did not run")

          m = json.load(open(manifests[-1]))
          counts = m.get("counts", {})
          print(json.dumps(counts, indent=2))

          # Floors sit far below a normal run (~2,000 DAs, ~1,300 CDCs, ~1,450
          # CCs over 120 days) so ordinary variation never trips them, but a
          # broken feed always does.
          FLOORS = {"OnlineDA": 300, "OnlineCDC": 150, "OnlineCC": 150}
          problems = [
              f"{svc}: {counts.get(svc, 0)} records (expected at least {floor})"
              for svc, floor in FLOORS.items()
              if counts.get(svc, 0) < floor
          ]
          if m.get("errors"):
              problems.append(f"{len(m['errors'])} source errors: {m['errors'][:3]}")

          if problems:
              print("::error::Collection looks broken, refusing to publish")
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          print("Collection looks healthy.")
          PY

      # -----------------------------------------------------------------
      # 2. Score and build
      # -----------------------------------------------------------------
      - name: Score and normalise
        id: score
        env:
          PYTHONPATH: src
        run: python3 src/normalise_and_score.py

      - name: Build report data
        env:
          PYTHONPATH: src
        run: python3 src/report_data.py

      - name: Render report, pages and dashboard
        env:
          PYTHONPATH: src
        run: |
          python3 src/build_report.py
          python3 src/build_landing.py
          python3 src/build_dashboard.py \
            --data-url /data/dashboard.json \
            --data-file site/dashboard-data.json

      # continue-on-error: if the PDF can't be produced, the site still
      # refreshes and keeps last week's PDF. A PDF problem must never cost you
      # a week of fresh data.
      - name: Export PDF
        id: pdf
        if: ${{ !inputs.skip_pdf }}
        continue-on-error: true
        run: node src/export_pdf.cjs

      - name: Assemble the deployable site
        env:
          PYTHONPATH: src
        run: |
          python3 src/build_site.py \
            --domain "${{ vars.SITE_DOMAIN || 'tradiesignal.com' }}" \
            --checkout "${{ vars.CHECKOUT_URL || '#pricing' }}"

      # Belt and braces: never let an empty or truncated page reach the site.
      - name: Sanity-check the build
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          checks = {
              "deploy/index.html": 50_000,
              "deploy/sample-report/index.html": 40_000,
              "deploy/demo/index.html": 10_000,
              "deploy/data/dashboard.json": 100_000,
          }
          bad = []
          for path, floor in checks.items():
              p = Path(path)
              if not p.exists():
                  bad.append(f"{path} missing")
              elif p.stat().st_size < floor:
                  bad.append(f"{path} is only {p.stat().st_size:,} bytes (expected >{floor:,})")

          data = json.loads(Path("deploy/data/dashboard.json").read_text())
          if len(data.get("rows", [])) < 200:
              bad.append(f"only {len(data.get('rows', []))} dashboard rows")

          if bad:
              print("::error::Build output failed sanity checks")
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)

          print(f"Build OK — {len(data['rows']):,} rows, generated {data['meta']['generated']}")
          PY

      # -----------------------------------------------------------------
      # 3. Publish
      # -----------------------------------------------------------------
      - name: Commit and push
        id: commit
        run: |
          git config user.name  "tradiesignal-bot"
          git config user.email "actions@users.noreply.github.com"

          git add deploy data/projects.csv data/summary.json data/report_payload.json \
                  reports/report_web.html reports/report_print.html || true
          if [ -f reports/Tradiesignal_Hunter_Report.pdf ]; then
            git add reports/Tradiesignal_Hunter_Report.pdf
          fi

          if git diff --cached --quiet; then
            echo "No changes — nothing lodged with the councils since the last run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python3 > /tmp/summary.txt <<'PY'
          import json
          s = json.load(open("data/summary.json"))
          value = s["construction_value_verified"] / 1e9
          print("{:,} projects, ${:.2f}bn verified".format(s["projects_live"], value))
          PY
            git commit -m "Data refresh $(date -u +%Y-%m-%d): $(cat /tmp/summary.txt)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs even on failure, and says plainly whether THIS run produced fresh
      # data. The first version printed the numbers from whatever summary.json
      # was already in the repo, which made a failed run look like it had
      # worked.
      - name: Summary
        if: always()
        env:
          SCORE_OUTCOME: ${{ steps.score.outcome }}
          PDF_OUTCOME: ${{ steps.pdf.outcome }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          from pathlib import Path

          score = os.environ.get("SCORE_OUTCOME", "")
          pdf = os.environ.get("PDF_OUTCOME", "")
          changed = os.environ.get("CHANGED", "")

          print("### Tradiesignal data refresh\n")

          if score != "success":
              print("> **No fresh data this run.** The pipeline stopped before scoring, "
                    "so **the live site is unchanged** and still shows the last good data.")
              print(">")
              print("> Open the **refresh** job above and look for the step with the red ✗ "
                    "— that is where it stopped.")
              raise SystemExit

          s = json.loads(Path("data/summary.json").read_text())
          q = s["quality"]["cost_confidence"]
          status = ("✅ Published — Netlify is deploying now." if changed == "true"
                    else "✅ Nothing new since last run — no deploy needed.")
          print(f"{status}\n")
          print(f"- **Generated:** {s['generated']}")
          print(f"- **Projects tracked:** {s['projects_live']:,}")
          print(f"- **Verified construction value:** ${s['construction_value_verified']/1e9:.2f}bn")
          print(f"- **High priority:** {s['by_priority'].get('high', 0)}")
          print(f"- **Flagged as suspect/unverified:** {q.get('suspect',0) + q.get('unverified',0)}")
          if pdf == "failure":
              print("- ⚠️ **PDF not regenerated** — the site kept last week's PDF. "
                    "Everything else refreshed normally.")
          elif pdf == "skipped":
              print("- PDF skipped on request.")
          print("\n**Most active builders**")
          for b in s["top_builders"][:5]:
              print(f"- {b['builder']} — {b['jobs']} jobs, ${b['value']:,}")
          PY

  # A failed refresh is invisible unless something shouts. This opens an issue
  # that names the exact step that failed, so it lands in your notifications
  # with the answer already in it.
  alert-on-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open an issue
        uses: actions/github-script@v8
        with:
          script: |
            // Find which step actually failed, so the issue says so directly.
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            const failed = [];
            for (const job of jobs.data.jobs) {
              for (const step of job.steps || []) {
                if (step.conclusion === 'failure') failed.push(step.name);
              }
            }
            const where = failed.length ? failed.map(s => `**${s}**`).join(', ') : 'unknown';

            const hints = {
              'Collect NSW ePlanning data':
                'The NSW API was unreachable or returned an error. Usually temporary — re-run in an hour.',
              'Guard against a silent empty collection':
                'The API returned too few records, so publishing was refused (the safety check working). ' +
                'Usually a brief outage. If it persists, a council name may no longer match the API list.',
              'Score and normalise':
                'A field the scorer depends on has probably changed shape in the NSW data.',
              'Commit and push':
                'Check Settings → Actions → General → Workflow permissions is set to "Read and write".',
              'Sanity-check the build':
                'A page or the dashboard data came out empty or truncated, so it was not published.',
            };
            const advice = failed.map(s => hints[s]).filter(Boolean).join('\n\n') ||
              'Open the run and read the log for the failed step.';

            const title = `Data refresh failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              'The weekly Tradiesignal data refresh failed. **The live site is unchanged** and still shows the last good data.',
              '',
              `**Failed at:** ${where}`,
              '',
              advice,
              '',
              `[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            // Reuse an open issue rather than stacking one up per week.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-refresh',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['data-refresh'],
              });
            }
