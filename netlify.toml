# Tradiesignal :: Netlify configuration
# Static site. No build step — the HTML is generated by src/build_site.py and
# committed, so Netlify only has to publish it.

[build]
  publish = "deploy"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# The dashboard page is now a thin 34KB shell that fetches its rows, so it
# can be cached briefly. The data file must NOT be cached hard — a stale copy
# would show last week's projects while the page claims to be current.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# The PDF is regenerated weekly and linked from the report page.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "/report"
  to = "/sample-report/"
  status = 301

[[redirects]]
  from = "/dashboard"
  to = "/demo/"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/#pricing"
  status = 301
